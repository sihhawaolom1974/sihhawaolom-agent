name: Sihhawaolom Daily Agent

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Atomic Environment Bootstrap & Package Creation
        run: |
          echo "=== Verifying Working Directory ==="
          pwd
          ls -la
          
          echo "=== Generating package.json Dynamically ==="
          cat << 'EOF' > package.json
          {
            "name": "sihhawaolom-agent",
            "version": "1.0.0",
            "private": true,
            "scripts": {
              "start": "node index.js"
            },
            "dependencies": {}
          }
          EOF
          
          echo "=== Verifying File Generation ==="
          ls -la package.json

      - name: Install Dependencies
        run: npm install

      - name: Execute Agent Script
        run: npm start
