name: Sihhawaolom Daily Agent

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  run-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Extract and Locate Files
        run: |
          unzip -o sihhawaolom-agent-main.zip
          ls -la
          EXTRACTED_DIR=$(find . -maxdepth 2 -name "package.json" -exec dirname {} \;)
          echo "Found package.json in: $EXTRACTED_DIR"
          if [ "$EXTRACTED_DIR" != "." ]; then
            cp -r $EXTRACTED_DIR/* .
          fi

      - name: Install dependencies
        run: npm install

      - name: Run Agent Script
        run: npm start
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
