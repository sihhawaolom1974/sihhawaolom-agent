name: Sihhawaolom Daily Agent

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Create package.json dynamically
        run: |
          echo '{
            "name": "sihhawaolom-agent",
            "version": "1.0.0",
            "private": true,
            "scripts": {
              "start": "node index.js"
            },
            "dependencies": {}
          }' > package.json
      - name: Install dependencies
        run: npm install
      - name: Run Agent Script
        run: npm start
